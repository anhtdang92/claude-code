# Default values for SecureShell AI Helm chart.
# Override with: helm install secureshell-ai ./helm/claude-code -f my-values.yaml

# ── Image ──────────────────────────────────────────────────────────────────────
image:
  repository: secureshell-ai
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ── Replica & Scaling ──────────────────────────────────────────────────────────
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget — keep at least 1 pod running during rolling updates
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Service Account ────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Pod configuration ──────────────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # PTY needs to write to /tmp
  capabilities:
    drop: ["ALL"]

# ── Resources ──────────────────────────────────────────────────────────────────
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# ── GPU Resources (for local inference) ────────────────────────────────────────
gpu:
  enabled: false
  # Uncomment for GPU-accelerated inference pods
  # requests:
  #   nvidia.com/gpu: 1
  # limits:
  #   nvidia.com/gpu: 1

# ── Service ────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# ── Ingress ────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: secureshell.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Network Policy (Air-Gap Enforcement) ───────────────────────────────────────
networkPolicy:
  enabled: true
  # Deny all egress by default (air-gapped mode)
  denyAllEgress: true
  # Allow egress only to the inference server
  allowedEgress:
    - podSelector:
        matchLabels:
          app: inference-server
    # Allow DNS resolution within cluster
    - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# ── LLM Provider Configuration ────────────────────────────────────────────────
config:
  # LLM provider: ollama | vllm | llamacpp | tgi | bedrock-govcloud | azure-govcloud | custom
  llmProvider: "ollama"
  # LLM API endpoint
  llmEndpoint: "http://inference-server.default.svc.cluster.local:11434"
  # Model name
  llmModel: ""
  # Auth provider: apikey | cac | ldap | mtls
  authProvider: "apikey"
  # Permission mode: default | plan | il4 | il5 | scif
  permissionMode: "default"
  # Classification mode: disabled | warn | enforce
  classificationMode: "disabled"
  # Audit format: jsonl | syslog | splunk
  auditFormat: "jsonl"
  # Maximum total concurrent sessions across all users
  maxSessions: "50"
  # Max concurrent sessions per user
  maxSessionsPerUser: "5"
  # Max new sessions per user per hour
  maxSessionsPerHour: "20"
  # Log level
  nodeEnv: production

# ── Secrets ────────────────────────────────────────────────────────────────────
# Set these via --set or a separate sealed-secret / external-secrets resource.
# NEVER commit real values here.
secrets:
  # LLM API key (optional, depends on provider)
  llmApiKey: ""
  # Static auth token for token provider (optional)
  authToken: ""
  # Cookie/session signing key — generate with: openssl rand -hex 32
  sessionSecret: ""
  # Audit log HMAC signing key — generate with: openssl rand -base64 32
  auditSigningKey: ""
  # Name of an existing secret to use instead of creating one
  existingSecret: ""

# ── Persistence ────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  # storageClass: ""   # leave empty to use cluster default
  accessMode: ReadWriteOnce
  size: 10Gi
  # Mount path inside the container
  mountPath: /data

# ── Model Weights Storage ─────────────────────────────────────────────────────
modelWeights:
  enabled: false
  # PVC for pre-downloaded model weights (for air-gapped inference)
  # storageClass: ""
  accessMode: ReadOnlyMany
  size: 100Gi
  mountPath: /models

# ── Probes ─────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health/live
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

# ── Node selection ─────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Extra environment variables ────────────────────────────────────────────────
extraEnv: []
# - name: AUDIT_ENABLED
#   value: "true"
# - name: USER_CLEARANCE
#   value: "SECRET"
