{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claude-code.fullname" . }}
  labels:
    {{- include "claude-code.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "claude-code.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic from within the namespace
    - from:
        - podSelector: {}
  egress:
    {{- if .Values.networkPolicy.denyAllEgress }}
    # Air-gapped mode: only allow traffic to specific targets
    {{- range .Values.networkPolicy.allowedEgress }}
    - to:
        {{- if .podSelector }}
        - podSelector:
            {{- toYaml .podSelector | nindent 12 }}
        {{- end }}
        {{- if .namespaceSelector }}
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
        {{- end }}
      {{- if .ports }}
      ports:
        {{- toYaml .ports | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- else }}
    # Non-air-gapped mode: allow all egress
    - {}
    {{- end }}
{{- end }}
